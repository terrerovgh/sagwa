<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sagwa CoreS3 render</title>
<style>html,body{margin:0;background:#888}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

// ?capture renders the loop frame by frame and POSTs each PNG to server.py;
// ?stills=t,t,... renders a few frames; ?stl posts the model as cores3.stl;
// with none of them it previews in real time (?t=seconds holds one moment).
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1000), H = +(q.get('h') || 1000);
const FPS = +(q.get('fps') || 20);
const CLIP_FPS = 24, CLIP_FRAMES = +(q.get('frames') || 428);
const T = CLIP_FRAMES / CLIP_FPS;           // one loop of the clips = one turn of the device

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);        // no background: the README's page shows through
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(24, W / H, 1, 2000);
camera.position.set(0, 38, 205);
camera.lookAt(0, -1, 0);

const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-90, 130, 150); scene.add(key);
const rimR = new THREE.DirectionalLight(0xdbe8ff, 2.2); rimR.position.set(140, 50, -110); scene.add(rimR);
const rimL = new THREE.DirectionalLight(0xfff0e6, 1.4); rimL.position.set(-150, 20, -90); scene.add(rimL);
const under = new THREE.DirectionalLight(0xffffff, 0.5); under.position.set(0, -120, 60); scene.add(under);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---- M5Stack CoreS3 + DIN base, as in M5Stack's photos (no mounting ears) ----
// Units are mm; the screen faces +z, the base is stacked behind the core.
const device = new THREE.Group(); scene.add(device);
const solid = new THREE.Group(); device.add(solid);   // what goes into the STL

const gray = new THREE.MeshPhysicalMaterial({ color: 0x45474c, roughness: 0.62, clearcoat: 0.15, clearcoatRoughness: 0.7, envMapIntensity: 0.8 });
const grayBase = new THREE.MeshPhysicalMaterial({ color: 0x404247, roughness: 0.66, clearcoat: 0.1, clearcoatRoughness: 0.7, envMapIntensity: 0.8 });
const hole = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.8 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x050506, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.5 });
const steel = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, roughness: 0.28, metalness: 1.0 });
const brass = new THREE.MeshStandardMaterial({ color: 0xc9a14a, roughness: 0.3, metalness: 1.0 });
const red = new THREE.MeshStandardMaterial({ color: 0xd6312f, roughness: 0.45 });

function add(geo, mat, x = 0, y = 0, z = 0, parent = solid) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m;
}
const rbox = (w, h, d, r, s = 4) => new RoundedBoxGeometry(w, h, d, s, r);
function slab(w, h, d, r, bevel) {
  const x = w / 2 - bevel, y = h / 2 - bevel, rr = r - bevel, sh = new THREE.Shape();
  sh.moveTo(-x + rr, -y); sh.lineTo(x - rr, -y); sh.quadraticCurveTo(x, -y, x, -y + rr);
  sh.lineTo(x, y - rr); sh.quadraticCurveTo(x, y, x - rr, y); sh.lineTo(-x + rr, y);
  sh.quadraticCurveTo(-x, y, -x, y - rr); sh.lineTo(-x, -y + rr); sh.quadraticCurveTo(-x, -y, -x + rr, -y);
  const g = new THREE.ExtrudeGeometry(sh, { depth: d - 2 * bevel, bevelEnabled: true, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 4, curveSegments: 24 });
  return g.translate(0, 0, -(d - 2 * bevel) / 2);
}
const disc = (r, depth, seg = 40) => new THREE.CylinderGeometry(r, r, depth, seg).rotateX(Math.PI / 2);  // axis along z
const discX = (r, depth, seg = 32) => new THREE.CylinderGeometry(r, r, depth, seg).rotateZ(Math.PI / 2); // axis along x
const discY = (r, depth, seg = 32) => new THREE.CylinderGeometry(r, r, depth, seg);                        // axis along y

const CORE_D = 16, BASE_D = 14, R = 6.5;
const CORE_Z = 0, BASE_Z = -(CORE_D / 2 + 0.7 + BASE_D / 2);
add(slab(54, 54, CORE_D, R, 1.3), gray, 0, 0, CORE_Z);
add(slab(53.0, 53.0, 1.6, R - 0.5, 0.3), hole, 0, 0, -CORE_D / 2 - 0.35);           // seam between core and base
add(slab(54, 54, BASE_D, R, 1.3), grayBase, 0, 0, BASE_Z);

// Front: one black glass panel with the screen, camera and sensors on it
const FRONT = CORE_D / 2;
// the black front sits proud of the shell, its glossy edge showing all round
add(slab(52.6, 52.6, 3.2, 6.0, 0.7), glass, 0, 0, FRONT - 1.2);
const FACE = FRONT + 0.41;

const SCR_W = 40.8, SCR_H = 30.6, SCR_Y = 2.2;
const scr = document.createElement('canvas'); scr.width = 640; scr.height = 480;
const sg = scr.getContext('2d');
const scrTex = new THREE.CanvasTexture(scr); scrTex.colorSpace = THREE.SRGBColorSpace; scrTex.anisotropy = 8;
add(new THREE.PlaneGeometry(SCR_W, SCR_H), new THREE.MeshBasicMaterial({ map: scrTex, toneMapped: false }), 0, SCR_Y, FACE + 0.01, device);

// Glass sheen sliding over the panel as it turns
const glareTex = canvasTex(1024, 256, (g, w) => {
  const l = g.createLinearGradient(0, 0, w, 0);
  for (const [o, a] of [[0, 0], [0.42, 0], [0.47, 0.5], [0.5, 0.9], [0.56, 0.25], [0.62, 0], [1, 0]]) l.addColorStop(o, `rgba(255,255,255,${a})`);
  g.fillStyle = l; g.fillRect(0, 0, w, 256);
});
glareTex.repeat.set(0.4, 1); glareTex.center.set(0.5, 0.5); glareTex.rotation = -0.55;
const glareMat = new THREE.MeshBasicMaterial({ map: glareTex, transparent: true, opacity: 0.09, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
add(rbox(51.6, 51.6, 0.01, 0.01, 2), glareMat, 0, 0, FACE + 0.05, device);

// Camera with its copper ring, centred under the screen; mics and sensor beside it
const CAM_Y = -21.0;
add(disc(2.25, 0.3), new THREE.MeshStandardMaterial({ color: 0xc8642a, roughness: 0.3, metalness: 0.7 }), 0, CAM_Y, FACE);
add(disc(1.75, 0.32), new THREE.MeshStandardMaterial({ color: 0x0d0f14, roughness: 0.4 }), 0, CAM_Y, FACE + 0.01);
add(disc(1.2, 0.34), new THREE.MeshPhysicalMaterial({ color: 0x16304f, roughness: 0.05, clearcoat: 1, envMapIntensity: 2.5 }), 0, CAM_Y, FACE + 0.02);
add(disc(0.35, 0.36, 16), new THREE.MeshBasicMaterial({ color: 0x9fc0e8 }), 0.45, CAM_Y + 0.45, FACE + 0.03, device);
for (const x of [-14.2, 14.2]) add(disc(0.55, 0.32, 20), hole, x, CAM_Y, FACE);
for (const x of [6.4, 8.8]) add(disc(0.42, 0.32, 20), new THREE.MeshStandardMaterial({ color: 0x2a2c30, roughness: 0.3 }), x, CAM_Y, FACE);

// Core sides: USB-C (left), power button (right), microSD slot (bottom)
const SIDE = 27;
add(rbox(1.2, 9.0, 3.4, 1.5), hole, -SIDE, -2, 0.5);
add(rbox(0.6, 6.6, 0.8, 0.3, 2), steel, -SIDE - 0.25, -2, 0.5, device);
add(discX(2.7, 1.0), hole, SIDE, 12, 0);
add(discX(2.0, 1.2), new THREE.MeshStandardMaterial({ color: 0x55575c, roughness: 0.5 }), SIDE + 0.15, 12, 0);
add(rbox(13, 1.2, 1.3, 0.5, 2), hole, -9, -SIDE, 1);

// Base: red Grove port (left), DC input + power switch (bottom), vents (right)
add(rbox(1.2, 8.4, 5.6, 1.0), red, -SIDE - 0.05, 2, BASE_Z);
add(rbox(1.0, 6.0, 2.6, 0.4, 2), hole, -SIDE - 0.2, 2, BASE_Z);
for (const x of [-14, -5]) add(discY(2.4, 1.2), hole, x, -SIDE, BASE_Z);
add(rbox(7.0, 0.3, 3.0, 0.3, 2), red, 9, -SIDE - 0.1, BASE_Z + 3.2, device);
add(rbox(7.5, 1.2, 3.6, 0.8), hole, 17, -SIDE, BASE_Z - 1.5);
add(rbox(3.4, 1.4, 2.6, 0.6), red, 18.5, -SIDE - 0.1, BASE_Z - 1.5);
for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) add(discX(0.45, 0.6, 12), hole, SIDE, -8 + i * 4, BASE_Z - 2.5 + j * 5);

// Back: the DIN base's plate with its clip, screws and brass inserts
const BACK = BASE_Z - BASE_D / 2;
add(rbox(46, 46, 0.8, 3.0, 4), new THREE.MeshPhysicalMaterial({ color: 0x3b3d42, roughness: 0.7 }), 0, 0, BACK - 0.2);
for (const y of [16.5, -16.5]) add(rbox(46, 2.2, 1.6, 0.6), grayBase, 0, y, BACK - 0.7);
add(rbox(13, 8, 2.6, 1.4), grayBase, 0, 21.5, BACK - 1.0);
add(rbox(7, 4.5, 1.0, 0.8), hole, 0, 22, BACK - 2.1);
for (const x of [-16.5, 16.5]) add(disc(0.9, 0.7), hole, x, 0, BACK - 0.6);
add(new THREE.TorusGeometry(6.5, 0.35, 12, 48), hole, 0, 0, BACK - 0.6);
add(disc(1.0, 0.8), hole, 0, 0, BACK - 0.6);
for (const x of [-10, 10]) { add(disc(1.9, 0.6), brass, x, 0, BACK - 0.55); add(disc(1.0, 0.7), hole, x, 0, BACK - 0.6); }
for (const y of [-9, 9]) add(disc(0.8, 0.7), hole, 0, y, BACK - 0.6);
for (const x of [-21, 21]) for (const y of [-21, 21]) {
  add(disc(2.3, 0.6), steel, x, y, BACK - 0.5);
  add(new THREE.CylinderGeometry(1.0, 1.0, 0.7, 6).rotateX(Math.PI / 2), hole, x, y, BACK - 0.6);
}

// ---- Sagwa on the screen ----------------------------------------------------
const frames = [];
await Promise.all(Array.from({ length: CLIP_FRAMES }, (_, i) => new Promise(res => {
  const im = new Image(); im.onload = res; im.src = `frames/${String(i).padStart(4, '0')}.jpg`; frames[i] = im;
})));
function drawScreen(t) {
  const f = frames[Math.floor(t * CLIP_FPS + 1e-6) % CLIP_FRAMES];
  sg.fillStyle = '#000'; sg.fillRect(0, 0, 640, 480);
  sg.drawImage(f, 72, 22, 552, 478);
  sg.fillStyle = 'rgba(14,14,18,0.35)'; sg.fillRect(0, 0, 640, 480);   // IPS black is never quite black
  scrTex.needsUpdate = true;
}

// One full turn per loop, lingering on the front and sweeping past the back.
const TAU = Math.PI * 2, rad = THREE.MathUtils.degToRad;
function pose(t) {
  const p = t / T;
  const yaw = TAU * p - 0.62 * Math.sin(TAU * p);
  const pitch = rad(4) + rad(9) * Math.sin(TAU * 2 * p + 0.5);
  device.rotation.set(pitch, yaw - rad(28), rad(1.5) * Math.sin(TAU * p), 'YXZ');
  device.position.y = 1.2 * Math.sin(TAU * 3 * p);
  glareTex.offset.x = 0.32 - Math.sin(device.rotation.y) * 0.5;
  drawScreen(t);
}

async function post(name, blob) { await fetch(`/frame/${name}`, { method: 'POST', body: blob }); }
const png = () => new Promise(r => renderer.domElement.toBlob(r, 'image/png'));

if (q.has('stl')) {
  device.rotation.set(0, 0, 0); device.position.set(0, 0, 0); device.updateMatrixWorld(true);
  const data = new STLExporter().parse(solid, { binary: true });
  await post('cores3.stl', new Blob([data]));
  document.title = 'done';
} else if (q.has('stills')) {
  for (const t of q.get('stills').split(',').map(Number)) {
    pose(t); renderer.render(scene, camera);
    await post(`still-${t}.png`, await png());
  }
  document.title = 'done';
} else if (q.has('capture')) {
  const N = Math.round(T * FPS);
  for (let i = 0; i < N; i++) {
    pose(i / FPS); renderer.render(scene, camera);
    await post(`${String(i).padStart(4, '0')}.png`, await png());
    document.title = `${i + 1}/${N}`;
  }
  document.title = 'done';
} else {
  const t0 = performance.now();
  const at = q.has('t') ? +q.get('t') : null;
  (function loop() {
    pose(at ?? (performance.now() - t0) / 1000 % T);
    renderer.render(scene, camera);
    if (at === null) requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
